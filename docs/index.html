<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#223d33"><title>Счёт</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f8f5;color:#17211e;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:0 20px 92px}header{height:76px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:18px}.mark{width:34px;height:34px;display:grid;place-items:center;border-radius:12px;background:#243d33;color:#fff}.role{border:0;background:#e4ebd7;color:#48623c;border-radius:12px;padding:8px;font-size:11px;font-weight:700}.hero{position:relative;overflow:hidden;border-radius:28px;background:#223d33;color:#fff;padding:28px 26px}.hero:after{content:"";position:absolute;width:165px;height:165px;border:1px solid #88a37555;border-radius:50%;right:-72px;top:-54px}.eyebrow{font-size:10px;letter-spacing:1.3px;font-weight:800;color:#97ad8b}.balance{font-weight:850;font-size:42px;letter-spacing:-2px;margin-top:7px}.sub{color:#b6c6b4;font-size:13px;margin-top:9px}.notice{font-size:12px;padding:12px 14px;border-radius:14px;margin:14px 0;background:#e9ede7;color:#5b665f}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.action{border:0;text-align:left;border-radius:20px;padding:16px 13px;display:flex;gap:10px;align-items:center;font:inherit;cursor:pointer}.in{background:#e2efd8;color:#244f33}.out{background:#f2e3d7;color:#754733}.icon,.round{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;font-size:20px;font-weight:800}.in .icon,.round.in{background:#c6e6ba}.out .icon,.round.out{background:#edd0be}.action b,.action small{display:block}.action b{font-size:14px}.action small{font-size:10px;margin-top:2px;opacity:.7}.overview{display:flex;align-items:center;padding:7px 6px 22px}.overview div{flex:1}.overview span,.overview strong{display:block}.overview span{font-size:11px;color:#748079;margin-bottom:4px}.overview i{height:33px;width:1px;background:#dce1d9;margin:0 15px}.positive{color:#2f7a48}.history{border-top:1px solid #dee2dd;padding-top:21px}.top{display:flex;justify-content:space-between;align-items:end}.top h1{font-size:22px;margin:4px 0 14px}.list{display:grid;gap:9px}.tx{display:flex;align-items:center;gap:11px;padding:12px;background:#fff;border:1px solid #e9ece7;border-radius:18px}.body{flex:1}.body b,.body small{display:block}.body b{font-size:14px}.body small{font-size:11px;color:#89928b;margin-top:3px}.sum{font-size:14px;font-weight:750}.delete{border:0;background:transparent;color:#ad6653;font-size:18px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:560px;width:100%;height:74px;background:#fffefdf2;border-top:1px solid #e1e5df;display:flex;justify-content:space-around;padding:8px 22px}.nav button{background:none;border:0;color:#89928b;font-size:10px;display:grid;gap:3px;place-items:center}.nav .active{color:#335f42;font-weight:700}.modal{display:none;position:fixed;inset:0;background:#15261b73;align-items:end;justify-content:center}.modal.show{display:flex}.sheet{width:min(560px,100%);padding:14px 22px 30px;background:#fbfcf8;border-radius:28px 28px 0 0}.handle{height:4px;width:40px;background:#d8ddd6;border-radius:5px;margin:0 auto 24px}.sheet h2{font-size:27px;margin:5px 0 20px}.sheet label{display:block;margin:15px 0;font-size:12px;font-weight:700;color:#53605a}.sheet input{display:block;width:100%;border:0;border-bottom:1px solid #d9ded8;background:transparent;font:inherit;font-size:17px;padding:14px 0 10px;outline:none}.save{width:100%;border:0;border-radius:16px;padding:16px;color:#fff;font-weight:800;margin-top:26px}.save.in{background:#2e7545}.save.out{background:#a45f42}.empty{text-align:center;color:#7b857e;padding:36px;background:#fff;border-radius:18px}</style></head><body><main class="app"><header><div class="brand"><span class="mark">₸</span>Счёт</div><span class="role" id="role">Загрузка</span></header><section class="hero"><div class="eyebrow">ТЕКУЩИЙ БАЛАНС</div><div class="balance" id="balance">—</div><div class="sub">Общий счёт · обновляется онлайн</div></section><div class="notice" id="notice">Подключаем общий счёт…</div><section class="actions"><button class="action in" onclick="openSheet('income')"><span class="icon">↓</span><span><b>Пополнение</b><small>добавить деньги</small></span></button><button class="action out" onclick="openSheet('expense')"><span class="icon">↑</span><span><b>Платёж</b><small>записать оплату</small></span></button></section><section class="overview"><div><span>Поступления</span><strong class="positive" id="income">+ —</strong></div><i></i><div><span>Платежи</span><strong id="expense">− —</strong></div></section><section class="history"><div class="top"><div><div class="eyebrow">ОПЕРАЦИИ</div><h1>Общая история</h1></div><button class="role" onclick="load()">Обновить</button></div><div class="list" id="list"><div class="empty">Загрузка…</div></div></section><nav class="nav"><button class="active"><span>⌂</span>Главная</button><button onclick="document.querySelector('.history').scrollIntoView({behavior:'smooth'})"><span>▤</span>История</button><button onclick="openSheet('income')"><span>＋</span>Добавить</button></nav></main><div class="modal" id="modal" onclick="if(event.target===this)closeSheet()"><form class="sheet" onsubmit="add(event)"><div class="handle"></div><div class="eyebrow">НОВАЯ ОПЕРАЦИЯ</div><h2 id="sheetTitle"></h2><label>Сумма, ₸<input id="amount" inputmode="numeric" required placeholder="0"></label><label>Комментарий <small>необязательно</small><input id="name" placeholder="Например, продукты"></label><button id="save" class="save" type="submit"></button></form></div><script>const API='https://schet-brata-aldik.yerk0wik.chatgpt.site/api/entries',key=new URLSearchParams(location.search).get('key'),admin=new URLSearchParams(location.search).get('role')==='admin';let mode='income',items=[];const money=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₸';function headers(){return{'Content-Type':'application/json','X-Access-Key':key||''}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){if(!key){notice.textContent='Открой персональную ссылку, которую прислал владелец.';role.textContent='Нет доступа';return}try{let r=await fetch(API,{headers:headers()}),d=await r.json();if(!r.ok)throw Error(d.error);items=d.entries;render();role.textContent=admin?'Владелец':'Добавление';notice.textContent=admin?'Ты видишь все операции и можешь удалять их.':'Добавляй пополнения и платежи — владелец увидит их сразу.'}catch(e){notice.textContent='Не удалось загрузить данные. Проверь ссылку или интернет.';role.textContent='Нет связи'}}function render(){let ins=items.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),out=items.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0);balance.textContent=money(ins-out);income.textContent='+ '+money(ins);expense.textContent='− '+money(out);list.innerHTML=items.length?items.map(x=>`<article class="tx"><span class="round ${x.type==='income'?'in':'out'}">${x.type==='income'?'↓':'↑'}</span><div class="body"><b>${esc(x.title)}</b><small>${esc(x.category)} · ${new Date(x.createdAt+'Z').toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</small></div><strong class="sum ${x.type==='income'?'positive':''}">${x.type==='income'?'+ ':'− '}${money(x.amount)}</strong>${admin?`<button class="delete" onclick="del(${x.id})">×</button>`:''}</article>`).join(''):'<div class="empty">Пока нет операций</div>'}function openSheet(v){mode=v;sheetTitle.textContent=v==='income'?'Новое пополнение':'Новый платёж';save.className='save '+(v==='income'?'in':'out');save.textContent=v==='income'?'Добавить пополнение':'Добавить платёж';modal.classList.add('show');amount.focus()}function closeSheet(){modal.classList.remove('show')}async function add(e){e.preventDefault();let a=+amount.value;if(!a)return;save.disabled=true;let r=await fetch(API,{method:'POST',headers:headers(),body:JSON.stringify({type:mode,amount:a,title:name.value,category:mode==='income'?'Пополнение':'Платёж'})});save.disabled=false;if(!r.ok){notice.textContent='Не удалось добавить операцию';return}e.target.reset();closeSheet();load()}async function del(id){if(!confirm('Удалить операцию?'))return;await fetch(API+'?id='+id,{method:'DELETE',headers:headers()});load()}load();setInterval(load,20000)</script></body></html>
