<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Счёт</title><meta name="theme-color" content="#223d33"><style>*{box-sizing:border-box}body{margin:0;background:#f7f8f5;color:#17211e;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:0 20px 92px;background:#f7f8f5}header{height:76px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:750}.mark{width:34px;height:34px;display:grid;place-items:center;border-radius:12px;background:#243d33;color:#fff}.avatar{border:0;border-radius:50%;width:36px;height:36px;background:#e4ebd7;color:#48623c;font-weight:700}.hero{position:relative;overflow:hidden;background:#223d33;color:#fff;border-radius:28px;padding:28px 26px}.hero:after{content:"";position:absolute;width:170px;height:170px;border:1px solid #88a37555;border-radius:50%;right:-72px;top:-55px}.eyebrow{font-size:10px;letter-spacing:1.3px;font-weight:750;color:#97ad8b}.balance{font-size:42px;line-height:1.1;font-weight:800;letter-spacing:-2px;margin-top:8px}.sub{font-size:13px;color:#b6c6b4;margin-top:9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.action{border:0;text-align:left;border-radius:20px;padding:16px 13px;display:flex;gap:10px;align-items:center;font:inherit;cursor:pointer}.in{background:#e2efd8;color:#244f33}.out{background:#f2e3d7;color:#754733}.icon,.round{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;font-size:20px;font-weight:800}.in .icon,.round.in{background:#c6e6ba}.out .icon,.round.out{background:#edd0be}.action b,.action small{display:block}.action b{font-size:14px}.action small{font-size:10px;margin-top:2px;opacity:.7}.overview{display:flex;align-items:center;padding:6px 6px 18px}.overview div{flex:1}.overview span,.overview strong{display:block}.overview span{font-size:11px;color:#748079;margin-bottom:4px}.overview strong{font-size:15px}.positive{color:#2f7a48}.overview i{width:1px;height:33px;background:#dce1d9;margin:0 15px}.today{display:flex;justify-content:space-between;align-items:center;border:1px solid #dce7d5;background:#edf2e9;border-radius:18px;padding:14px 15px;margin-bottom:22px}.today p{margin:0 0 3px;font-size:11px;color:#718075}.today b{font-size:15px}.today small{font-size:10px;color:#82907f}.history{border-top:1px solid #dee2dd;padding-top:22px}.top{display:flex;justify-content:space-between;align-items:end}.top h1{font-size:22px;margin:4px 0 14px}.top button{border:0;background:none;color:#72816e;font-size:12px}.search{width:100%;border:1px solid #e0e5df;background:white;border-radius:14px;padding:12px 13px;font:inherit;font-size:13px;outline:none}.filters{display:flex;gap:7px;overflow:auto;margin:10px 0 15px}.filters button{border:0;background:#e9ede7;color:#66726a;padding:8px 11px;border-radius:10px;white-space:nowrap;font:inherit;font-size:11px;font-weight:650}.filters .sel{background:#253e34;color:#fff}.list{display:grid;gap:9px}.tx{display:flex;gap:11px;align-items:center;padding:12px;background:#fff;border:1px solid #e9ece7;border-radius:18px;box-shadow:0 4px 14px #203d2910}.body{flex:1}.body b,.body small{display:block}.body b{font-size:14px}.body small{font-size:11px;color:#89928b;margin-top:3px}.sum{font-size:14px;font-weight:700}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;height:74px;background:#fffefdf2;border-top:1px solid #e1e5df;display:flex;justify-content:space-around;padding:8px 22px;backdrop-filter:blur(12px)}.nav button{display:grid;place-items:center;gap:3px;background:none;border:0;color:#89928b;font-size:10px}.nav .active{color:#335f42;font-weight:700}.modal{display:none;position:fixed;inset:0;background:#15261b73;align-items:end;justify-content:center}.modal.show{display:flex}.sheet{width:min(560px,100%);background:#fbfcf8;border-radius:28px 28px 0 0;padding:14px 22px 30px}.handle{height:4px;width:40px;border-radius:5px;background:#d8ddd6;margin:0 auto 24px}.sheet h2{margin:5px 0 20px;font-size:27px}.sheet label{display:block;color:#53605a;font-size:12px;font-weight:650;margin:15px 0}.sheet input{display:block;width:100%;margin-top:4px;padding:14px 0 10px;border:0;border-bottom:1px solid #d9ded8;background:transparent;font:inherit;font-size:17px;outline:none}.cats{display:flex;gap:7px;overflow:auto;margin-top:8px}.cats button{border:0;border-radius:10px;padding:8px 11px;background:#e9ede7;color:#66726a;white-space:nowrap;font:inherit;font-size:11px}.cats .sel{background:#253e34;color:#fff}.save{width:100%;border:0;color:#fff;border-radius:16px;padding:16px;margin-top:26px;font-weight:750;font-size:15px}.save.in{background:#2e7545}.save.out{background:#a45f42}</style></head><body><main class="app"><header><div class="brand"><span class="mark">₸</span>Счёт</div><button class="avatar">А</button></header><section class="hero"><div class="eyebrow">ТЕКУЩИЙ БАЛАНС</div><div class="balance" id="balance">19 500 ₸</div><div class="sub">Все деньги и операции в одном месте</div></section><section class="actions"><button class="action in" onclick="openSheet('in')"><span class="icon">↓</span><span><b>Пополнение</b><small>добавить деньги</small></span></button><button class="action out" onclick="openSheet('out')"><span class="icon">↑</span><span><b>Платёж</b><small>записать оплату</small></span></button></section><section class="overview"><div><span>Поступления</span><strong class="positive" id="income">+ 23 000 ₸</strong></div><i></i><div><span>Платежи</span><strong id="expense">- 3 500 ₸</strong></div></section><section class="today"><div><p>Сегодня потрачено</p><b id="today">2 300 ₸</b></div><small id="count">2 операции</small></section><section class="history"><div class="top"><div><div class="eyebrow">ОПЕРАЦИИ</div><h1>История</h1></div><button onclick="if(confirm('Очистить все записи?')){items=[];save();render()}">Очистить</button></div><input class="search" placeholder="⌕  Поиск по операциям" oninput="q=this.value;render()"><div class="filters"><button class="sel" onclick="setFilter('all',this)">Все</button><button onclick="setFilter('in',this)">Пополнения</button><button onclick="setFilter('out',this)">Платежи</button></div><div class="list" id="list"></div></section><nav class="nav"><button class="active"><span>⌂</span>Главная</button><button onclick="document.querySelector('.history').scrollIntoView({behavior:'smooth'})"><span>▤</span>История</button><button onclick="openSheet('in')"><span>＋</span>Добавить</button></nav></main><div class="modal" id="modal" onclick="if(event.target==this)closeSheet()"><form class="sheet" onsubmit="add(event)"><div class="handle"></div><div class="eyebrow">НОВАЯ ОПЕРАЦИЯ</div><h2 id="sheetTitle"></h2><label>Сумма, ₸<input id="amount" inputmode="numeric" placeholder="0" required></label><label>Комментарий <small>необязательно</small><input id="name" placeholder="Например, продукты"></label><div id="catWrap"><div class="eyebrow">КАТЕГОРИЯ</div><div class="cats" id="cats"></div></div><button class="save" id="save" type="submit"></button></form></div><script>let items=JSON.parse(localStorage.getItem('schet-pages')||'null')||[{id:1,type:'in',a:15000,n:'Перевод',c:'Пополнение',d:'Сегодня, 11:42'},{id:2,type:'out',a:2300,n:'Обед',c:'Еда',d:'Сегодня, 14:10'},{id:3,type:'in',a:8000,n:'Оплата',c:'Пополнение',d:'Вчера, 22:18'},{id:4,type:'out',a:1200,n:'Топливо',c:'Транспорт',d:'Вчера, 19:40'}];let mode='in',cat='Еда',q='',filter='all';const fmt=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₸';function save(){localStorage.setItem('schet-pages',JSON.stringify(items))}function render(){let ins=items.filter(x=>x.type==='in').reduce((s,x)=>s+x.a,0),outs=items.filter(x=>x.type==='out').reduce((s,x)=>s+x.a,0);balance.textContent=fmt(ins-outs);income.textContent='+ '+fmt(ins);expense.textContent='- '+fmt(outs);let todays=items.filter(x=>x.d.includes('Сегодня'));today.textContent=fmt(todays.filter(x=>x.type==='out').reduce((s,x)=>s+x.a,0));count.textContent=todays.length+' операции';let show=items.filter(x=>(filter==='all'||x.type===filter)&&(x.n+' '+x.c).toLowerCase().includes(q.toLowerCase()));list.innerHTML=show.map(x=>`<article class="tx"><span class="round ${x.type}">${x.type==='in'?'↓':'↑'}</span><div class="body"><b>${x.n}</b><small>${x.c} · ${x.d}</small></div><strong class="sum ${x.type==='in'?'positive':''}">${x.type==='in'?'+ ':'− '}${fmt(x.a)}</strong></article>`).join('')||'<div class="tx">Ничего не найдено</div>'}function setFilter(v,b){filter=v;document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');render()}function openSheet(v){mode=v;modal.classList.add('show');sheetTitle.textContent=v==='in'?'Новое пополнение':'Новый платёж';save.className='save '+v;save.textContent=v==='in'?'Добавить пополнение':'Добавить платёж';catWrap.style.display=v==='out'?'block':'none';cats.innerHTML=['Еда','Транспорт','Покупки','Связь','Другое'].map(x=>`<button type="button" class="${x===cat?'sel':''}" onclick="cat='${x}';openSheet(mode)">${x}</button>`).join('');amount.focus()}function closeSheet(){modal.classList.remove('show')}function add(e){e.preventDefault();let a=+amount.value;if(!a)return;items.unshift({id:Date.now(),type:mode,a,n:name.value|| (mode==='in'?'Пополнение':'Платёж'),c:mode==='in'?'Пополнение':cat,d:'Только что'});save();e.target.reset();closeSheet();render()}render()</script></body></html>
